[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transcript-helper"
version = "0.2.2"
description = "Local transcript generator for Obsidian Web Clipper CN"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "requests>=2.32,<3",
  "yt-dlp[default]>=2025.6.30",
  "faster-whisper>=1.1,<2",
]

[project.scripts]
transcript-helper = "transcript_helper.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
